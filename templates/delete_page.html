{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='edit.css') }}">
<h2>Delete Products</h2>

<div class="container">
{% for product in products %}
    <div class="card">
        <h3>{{ product['name'] }}</h3>

        <a href="/delete/{{ product['product_id'] }}">
            <button style="background:red;">Delete</button>
        </a>
    </div>
{% endfor %}
</div>

{% endblock %}
